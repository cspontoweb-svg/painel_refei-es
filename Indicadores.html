<!DOCTYPE html><html lang="pt-BR"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS | Dashboard</title><style>
:root{--o:#f28c28;--line:#e5e7eb;--muted:#68707a}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font:15px Arial;color:#171717}header{background:#111;color:white;padding:19px 22px;border-bottom:5px solid var(--o)}main{max-width:1200px;margin:22px auto;padding:0 14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.filters,.cards,.charts{display:grid;gap:12px}.filters{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(4,1fr);margin:14px 0}.charts{grid-template-columns:1fr 1fr}.card small{font-size:11px;color:var(--muted);font-weight:bold}.card strong{display:block;font-size:28px;margin-top:8px}label{display:block;font-weight:bold;font-size:12px;margin-bottom:7px}input,select{width:100%;padding:10px;border:1px solid #ccd1d7;border-radius:8px}button,a{display:inline-block;margin:10px 6px 0 0;padding:11px 14px;background:var(--o);color:#111;border:0;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer}canvas{max-width:100%}.muted{font-size:12px;color:var(--muted)}@media(max-width:760px){.filters,.cards,.charts{grid-template-columns:1fr 1fr}}@media(max-width:500px){.filters,.cards,.charts{grid-template-columns:1fr}}</style></head><body><header><b>CS | DASHBOARD DE INDICADORES</b><div class="muted" style="color:#ddd">Painel de gestão operacional</div></header><main>
<div class="panel"><div class="filters"><div><label>Data inicial</label><input type="date" id="ini"></div><div><label>Data final</label><input type="date" id="fim"></div><div><label>Obra</label><select id="obra"><option value="">Todas</option></select></div><div><label>Trecho</label><select id="trecho"><option value="">Todos</option></select></div></div><button id="apply">Aplicar filtros</button><a href="?page=admin" target="_top">Voltar ao ADMIN</a><div id="msg" class="muted"></div></div>
<div class="cards"><div class="card"><small>APONTAMENTOS</small><strong id="total">0</strong></div><div class="card"><small>APROVADOS</small><strong id="approved">0</strong></div><div class="card"><small>RECUSADOS</small><strong id="denied">0</strong></div><div class="card"><small>VISITANTES</small><strong id="visitors">0</strong></div><div class="card"><small>COLABORADORES ATIVOS</small><strong id="active">0</strong></div><div class="card"><small>PENDENTES DE ENVIO</small><strong id="pending">0</strong></div></div>
<div class="charts"><div class="panel"><h3>Apontamentos por refeição</h3><canvas id="mealChart"></canvas></div><div class="panel"><h3>Aprovados x recusados</h3><canvas id="statusChart"></canvas></div></div><div class="panel" style="margin-top:12px"><h3>Registros do período</h3><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th>Data</th><th>Hora</th><th>Matrícula</th><th>Nome</th><th>Obra</th><th>Trecho</th><th>Refeição</th><th>Status</th><th>Motivo</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('cs_admin_token'),mealChart,statusChart;
function call(fn,...a){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...a))}
async function init(){if(!token){$('msg').textContent='Acesse primeiro o ADMIN e autentique-se para consultar indicadores.';return}try{let b=await call('apiAdminBootstrap',token);$('obra').innerHTML+='<option>'+b.obras.map(x=>x[1]).join('</option><option>')+'</option>';$('trecho').innerHTML+='<option>'+b.frentes.map(x=>x[2]).join('</option><option>')+'</option>';load()}catch(e){$('msg').textContent=e.message}}
async function load(){try{let d=await call('obterIndicadores',{inicio:$('ini').value,fim:$('fim').value,obra:$('obra').value,trecho:$('trecho').value},token);['total','approved','denied','visitors','active','pending'].forEach((k)=>$(k).textContent=d[k]);$('rows').innerHTML=d.records.map(r=>`<tr>${[r.data,r.hora,r.matricula,r.nome,r.obra,r.trecho,r.refeicao,r.status,r.motivo].map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('');if(mealChart)mealChart.destroy();if(statusChart)statusChart.destroy();if(window.Chart){mealChart=new Chart($('mealChart'),{type:'bar',data:{labels:Object.keys(d.byMeal),datasets:[{label:'Registros',data:Object.values(d.byMeal),backgroundColor:'#f28c28'}]}});statusChart=new Chart($('statusChart'),{type:'doughnut',data:{labels:['Aprovados','Recusados'],datasets:[{data:[d.approved,d.denied],backgroundColor:['#16834a','#c83c3c']}]}})}$('msg').textContent='Dados atualizados a partir da planilha.'}catch(e){$('msg').textContent=e.message}}
$('apply').onclick=load;init();
</script></body></html>
